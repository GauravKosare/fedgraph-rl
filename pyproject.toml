[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedgraph-rl"
version = "0.1.0"
description = "RL-orchestrated federated Graph Neural Network fraud detection — a negative-result study on learned client selection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gaurav Kosare" }]
keywords = ["federated-learning", "graph-neural-network", "reinforcement-learning",
            "client-selection", "fraud-detection", "gcn", "reinforce", "actor-critic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]

[project.urls]
Documentation = "https://github.com/GauravKosare/fedgraph-rl/tree/main/docs"

[tool.setuptools]
packages = ["fedgraphrl"]
